# Actions surveillées pour un achat long terme. Le bot ne fait que prévenir : il n'achète rien.
# ticker = symbole Yahoo Finance
actions:
  - {nom: Friedrich Vorwerk,  ticker: VH2.DE}
  - {nom: Theon International, ticker: THEON.AS}
  - {nom: Parrot,             ticker: PARRO.PA}
  - {nom: Kodiak Gas Services, ticker: KGS}
  - {nom: Centrus Energy,     ticker: LEU}
  - {nom: Filtronic,          ticker: FTC.L}
  - {nom: AIRO Group,         ticker: AIRO}
  - {nom: NuScale Power,      ticker: SMR}
  - {nom: Nano Nuclear,       ticker: NNE}

# Réglage « équilibré ». Un creux est signalé quand les trois conditions sont réunies :
regles:
  baisse_min: 0.15        # au moins -15 % sous le plus haut des 6 derniers mois
  ampleur_min: 1.5        # baisse d'au moins 1,5 fois l'amplitude normale d'un mois pour CETTE action
                          # (une action très volatile doit baisser plus pour que ce soit un vrai creux)
  rsi_max: 40             # RSI 14 jours sous 40 : la baisse est marquée, l'action est survendue
  pause_jours: 20         # pas de nouvelle alerte sur la même action pendant 20 jours...
  aggravation: 0.10       # ...sauf si elle a encore perdu 10 points de plus depuis la dernière alerte
